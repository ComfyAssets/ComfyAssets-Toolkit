name: Toolkit tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  toolkit:
    name: toolkit contracts and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - name: Retain coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toolkit-test-reports
          path: |
            coverage/
            test-results/
            !coverage/raw/**
          retention-days: 14
